name: CI / Publish

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test ./src/

      - name: Build
        run: bun run build

      - name: Build tests
        run: bun test ./tests/

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish (if version changed)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get package version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $PKG_VERSION"

      - name: Check npm registry
        id: npm_check
        run: |
          VERSION=${{ steps.version.outputs.value }}
          PUBLISHED=$(npm view future-audio-intelligence@$VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            echo "⏭️  npm: v$VERSION already published — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 npm: v$VERSION not found — will publish"
          fi

      - name: Check GitHub Packages registry
        id: gpr_check
        run: |
          VERSION=${{ steps.version.outputs.value }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          PUBLISHED=$(npm view @$OWNER/future-audio-intelligence@$VERSION version \
            --registry https://npm.pkg.github.com 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            echo "⏭️  GitHub Packages: v$VERSION already published — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 GitHub Packages: v$VERSION not found — will publish"
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.skip == 'false'
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.gpr_check.outputs.skip == 'false'
        run: |
          # Append GitHub Packages auth to the .npmrc npm is actually reading
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> $NPM_CONFIG_USERCONFIG

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const owner = '${{ github.repository_owner }}'.toLowerCase();
            pkg.name = '@' + owner + '/' + pkg.name.replace(/^@[^/]+\//, '');
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish --access public --ignore-scripts
