name: CI / Publish

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test ./src/

      - name: Build
        run: bun run build

      - name: Build tests
        run: bun test ./tests/

      - name: Get version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $PKG_VERSION"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-npm:
    name: Publish → npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version already on npm
        id: check
        run: |
          VERSION=${{ needs.test.outputs.version }}
          PUBLISHED=$(npm view future-audio-intelligence@$VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  v$VERSION already on npm — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 v$VERSION not on npm — publishing"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    name: Publish → GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Check if version already on GitHub Packages
        id: check
        run: |
          VERSION=${{ needs.test.outputs.version }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PUBLISHED=$(npm view @$OWNER/future-audio-intelligence@$VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  v$VERSION already on GitHub Packages — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 v$VERSION not on GitHub Packages — publishing"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set scoped package name
        if: steps.check.outputs.skip == 'false'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@${{ github.repository_owner }}/' + pkg.name.replace(/^@[^/]+\//, '');
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
